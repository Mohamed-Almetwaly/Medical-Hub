<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Hub - Order Confirmation</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mulish', sans-serif; }
        body { background-color: #ffffff; width: 100%; color: #1e293b; padding-bottom: 60px; }
        .main-header { background-color: #0c1a30; padding: 18px 0; width: 100%; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: flex-start; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 40px !important; width: auto !important; object-fit: contain; display: block; }
        .logo-area h1 { color: #ffffff; font-size: 22px; font-weight: 700; }
        .logo-area h1 span { font-size: 15px; font-weight: 400; color: #cbd5e1; }
        .checkout-main { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .product-summary-card {
            background: #ffffff; border: 1px solid #e4e6ea; border-radius: 16px;
            padding: 25px 35px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02); margin-bottom: 25px;
        }
        .product-details { display: flex; align-items: center; gap: 25px; }
        .product-details img { width: 75px; height: 75px; object-fit: contain; }
        .product-info-text { display: flex; flex-direction: column; gap: 12px; }
        .product-title { font-size: 16px; font-weight: 700; color: #1e293b; }
        .quantity-controls { display: flex; align-items: center; gap: 15px; color: #475569; }
        .product-total-price { font-size: 17px; font-weight: 800; color: #2a6496; }
        .pharmacy-card { border: 1px solid #e4e6ea; border-radius: 12px; padding: 24px 35px; display: flex; align-items: center; justify-content: space-between; background: #ffffff; margin-bottom: 30px; }
        .pharmacy-left { display: flex; align-items: center; gap: 25px; }
        .pharmacy-logo-box { width: 70px; height: 70px; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 5px; background: #ffffff; }
        .pharmacy-logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .pharmacy-meta { display: flex; flex-direction: column; gap: 6px; }
        .pharmacy-name { font-size: 16px; font-weight: 800; color: #0f172a; }
        .rating-stars { color: #ffb100; font-size: 15px; letter-spacing: 2px; }
        .delivery-info { font-size: 13px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 6px; }
        .btn-price-info { background-color: #b3cbe3; color: #0f172a; border: none; border-radius: 8px; padding: 12px 24px; font-size: 14px; font-weight: 700; white-space: nowrap; }
        .checkout-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 30px; margin-bottom: 40px; align-items: start; }
        .address-box { border: 1px solid #a3b8cc; border-radius: 12px; padding: 35px; background: #ffffff; display: flex; flex-direction: column; gap: 20px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-control { width: 100%; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; color: #334155; background: #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.03); outline: none; transition: border-color 0.2s; }
        .form-control::placeholder { color: #94a3b8; font-weight: 600; }
        .form-control:focus { border-color: #2a6496; }
        .phone-wrapper { position: relative; width: 100%; }
        .phone-wrapper .form-control { padding-right: 50px; }
        .flag-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 22px; height: auto; pointer-events: none; display: block; }
        .payment-box { display: flex; flex-direction: column; gap: 20px; }
        .pay-via-title { font-size: 18px; font-weight: 800; color: #000000; margin-bottom: -5px; }
        .payment-options { display: flex; gap: 12px; }
        .pay-opt-btn { flex: 1; border: none; border-radius: 8px; padding: 14px 10px; font-size: 13px; font-weight: 700; color: #000000; background-color: #b3cbe3; cursor: pointer; text-align: center; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .pay-opt-btn.active { background-color: #a3c4dc; border: 1.5px solid #1e293b; font-weight: 800; }
        .note-control { width: 100%; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; background: #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.03); outline: none; }
        .note-control::placeholder { color: #64748b; font-weight: 600; }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 0 5px; }
        .total-title { font-size: 19px; font-weight: 800; color: #000000; }
        .total-val { font-size: 20px; font-weight: 800; color: #000000; }
        .order-confirm-btn { width: 100%; background-color: #0c1a30; color: #ffffff; border: none; border-radius: 16px; padding: 18px; font-size: 18px; font-weight: 700; cursor: pointer; text-align: center; box-shadow: 0 4px 12px rgba(12,26,48,0.15); transition: background 0.2s; }
        .order-confirm-btn:hover { background-color: #050c18; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <img src="assets/images/logo.png" alt="Medical Hub Logo" class="logo-img">
                <h1>MEDICAL HUB <span>.com</span></h1>
            </div>
        </div>
    </header>
    <main class="checkout-main">
        <div class="product-summary-card">
            <div class="product-details">
                <img id="check-product-img" src="" alt="Product Image">
                <div class="product-info-text">
                    <span class="product-title" id="check-product-title">Product Name</span>
                    <div class="quantity-controls">
                        <span id="check-quantity-val" style="font-weight: 700; font-size: 15px; color: #2a6496;">1</span>
                    </div>
                </div>
            </div>
            <div class="product-total-price" id="check-product-price">0 EGP</div>
        </div>
        <div class="pharmacy-card">
            <div class="pharmacy-left">
                <div class="pharmacy-logo-box">
                    <img id="check-pharmacy-img" src="" alt="Pharmacy Logo">
                </div>
                <div class="pharmacy-meta">
                    <span class="pharmacy-name" id="check-pharmacy-name">Pharmacy Name</span>
                    <span class="rating-stars">★★★★☆</span>
                    <div class="delivery-info">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2a6496" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                        <span id="check-delivery-fee">0 EGP</span>
                    </div>
                </div>
            </div>
            <div class="pharmacy-actions">
                <button class="btn-price-info"><span id="check-dyn-count">1 product</span> - <span id="check-dyn-price">0 EGP</span></button>
            </div>
        </div>
        <div class="checkout-grid">
            <div class="address-box">
                <input type="text" class="form-control" placeholder="Full Name">
                <input type="text" class="form-control" placeholder="Address">
                <div class="input-row">
                    <input type="text" class="form-control" placeholder="Apartment number">
                    <input type="text" class="form-control" placeholder="Building number">
                </div>
                <div class="phone-wrapper">
                    <input type="tel" class="form-control" placeholder="Phone number">
                    <img src="https://flagcdn.com/w40/eg.png" alt="Egypt Flag" class="flag-icon">
                </div>
            </div>
            <div class="payment-box">
                <span class="pay-via-title">Pay via</span>
                <div class="payment-options">
                    <button class="pay-opt-btn active" onclick="selectPayment(this)">Cash</button>
                    <button class="pay-opt-btn" onclick="selectPayment(this)">Card on Delivery</button>
                    <button class="pay-opt-btn" onclick="selectPayment(this)">Online Payment</button>
                </div>
                <input type="text" class="note-control" placeholder="Note upon delivery">
                <div class="total-row">
                    <span class="total-title">Total order</span>
                    <span class="total-val" id="check-final-total">0 EGP</span>
                </div>
            </div>
        </div>
        <button class="order-confirm-btn" onclick="confirmOrder()">Order Confirmation</button>
    </main>
    <script>
        function selectPayment(btn) {
            document.querySelectorAll('.pay-opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        function confirmOrder() {
            localStorage.removeItem('selectedProduct');
            window.location.href = 'order-success.html';
        }
        document.addEventListener("DOMContentLoaded", () => {
            const savedProduct = localStorage.getItem('selectedProduct');
            const pharmacyName = localStorage.getItem('selectedPharmacyName') || 'Blue El-Shorouk';
            const deliveryFee = parseInt(localStorage.getItem('deliveryFee') || '20');
            if (savedProduct) {
                const product = JSON.parse(savedProduct);
                const productTotal = product.basePrice * product.quantity;
                const finalTotal = productTotal + deliveryFee;
                document.getElementById('check-product-img').setAttribute('src', product.img || 'assets/images/logo.png');
                document.getElementById('check-product-title').textContent = product.name;
                document.getElementById('check-quantity-val').textContent = product.quantity;
                document.getElementById('check-product-price').textContent = productTotal + " EGP";
                document.getElementById('check-pharmacy-name').textContent = pharmacyName;
                document.getElementById('check-pharmacy-img').setAttribute('src', 'assets/images/' + pharmacyName + '.png');
                document.getElementById('check-delivery-fee').textContent = deliveryFee + " EGP";
                document.getElementById('check-dyn-count').textContent = product.quantity + (product.quantity === 1 ? " product" : " products");
                document.getElementById('check-dyn-price').textContent = productTotal + " EGP";
                document.getElementById('check-final-total').textContent = finalTotal + " EGP";
            } else {
                window.location.href = 'cart.html';
            }
        });
    </script>
</body>
</html>
