    <footer class="ph-footer">

        <div class="gplay-wrapper">

                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
            </a>
        </div>
    </footer>

   <script>
    function addToCart(btn) {
        // 1. تحديد الكارت الذي تم الضغط عليه
        const card = btn.closest('.php-card');
        
        // 2. سحب الصورة والسعر تلقائياً من عناصر الكارت لمنع الـ NaN
        const img = card.querySelector('.php-card-row img').getAttribute('src');
        const priceText = card.querySelector('.php-price').textContent;
        const price = parseInt(priceText.replace(/[^0-9]/g, '')); // استخراج الرقم فقط
        
        // 3. تحديد اسم افتراضي أو جلب اسم المنتج
        const name = card.querySelector('img').getAttribute('alt') || 'Medical Product';

        // 4. تخزين البيانات كاملة بالـ LocalStorage لتستلمها صفحة السلة بنجاح
        const productData = { 
            id: Date.now(), 
            name: name, 
            basePrice: price, 
            img: img, 
            quantity: 1 
        };
        localStorage.setItem('selectedProduct', JSON.stringify(productData));

        // 5. تأثير إضافة المنتج البصري
        btn.textContent = '✓ Added';
        btn.classList.add('added');

        // 6. التوجيه التلقائي المباشر لصفحة السلة
        setTimeout(() => {
            window.location.href = 'cart.html';
        }, 400);
    }

    // لتخصيص الهيدر بناءً على الكاتيجوري القادم من الروابط
    const params = new URLSearchParams(window.location.search);
    const cat = params.get('category');
    if (cat) {
        document.getElementById('php-cat-title').textContent = cat;
        document.getElementById('php-search-input').placeholder = 'Search in ' + cat;
    }
    </script>
</body>
