<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Hub - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <div class="logo">
                <a href="index.html" style="display:flex; align-items:center; text-decoration:none; gap:12px;">
                    <img src="assets/images/logo.png" alt="Logo" class="logo-img">
                    <h1>MEDICAL HUB<span>.com</span></h1>
                </a>
            </div>
            <nav class="sliding-nav">
                <div class="nav-indicator"></div>
                <a href="signup.html" class="nav-item">Sign Up</a>
                <a href="login.html" class="nav-item">Login</a>
                <span class="sep">|</span>
                <a href="#" class="nav-item">عربي</a>
            </nav>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card">
            <h2>Login</h2>
            <p id="login-error" style="color:#d32f2f; font-size:14px; font-family:'Mulish',sans-serif; margin:0 0 10px; min-height:18px;"></p>
            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="login-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <div class="extra-options">
                    <label><input type="checkbox" id="remember-me"> Remember me</label>
                    <a href="#" class="forgot-pass">Forgot password?</a>
                </div>
                <button type="submit" class="btn-login">Login</button>
            </form>
            <div class="foot-link">
                Don't have an account? <a href="signup.html">Create Account</a>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:14px; padding:2rem; max-width:400px; width:90%; text-align:center; font-family:'Mulish',sans-serif; box-shadow:0 20px 60px rgba(0,0,0,0.2);">
            <div style="width:56px; height:56px; border-radius:50%; background:#EBF4FF; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem;">
                <svg width="26" height="26" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h2 style="font-size:20px; font-weight:800; margin:0 0 8px; color:#1a1a2e;">Forgot your password?</h2>
            <p style="font-size:14px; color:#666; margin:0 0 1.5rem; line-height:1.7;">Contact us through any of the following options and we'll help you reset your password.</p>
            <div style="display:flex; align-items:center; gap:12px; background:#f5f7fa; border-radius:10px; padding:12px 16px; margin-bottom:10px; text-align:left;">
                <div style="width:36px; height:36px; border-radius:50%; background:#EBF4FF; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                    <svg width="18" height="18" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 11.36 19a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </div>
                <div><p style="font-size:11px; color:#999; margin:0;">Call us</p><p style="font-size:15px; font-weight:700; margin:0; color:#1a1a2e;">01030705465</p></div>
            </div>
            <div style="display:flex; align-items:center; gap:12px; background:#f5f7fa; border-radius:10px; padding:12px 16px; margin-bottom:10px; text-align:left;">
                <div style="width:36px; height:36px; border-radius:50%; background:#EBF4FF; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                    <svg width="18" height="18" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 11.36 19a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </div>
                <div><p style="font-size:11px; color:#999; margin:0;">Call us</p><p style="font-size:15px; font-weight:700; margin:0; color:#1a1a2e;">01558675591</p></div>
            </div>
            <div style="display:flex; align-items:center; gap:12px; background:#f5f7fa; border-radius:10px; padding:12px 16px; margin-bottom:20px; text-align:left;">
                <div style="width:36px; height:36px; border-radius:50%; background:#EBF4FF; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                    <svg width="18" height="18" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <div><p style="font-size:11px; color:#999; margin:0;">Email us</p><p style="font-size:14px; font-weight:700; margin:0; color:#185FA5;">almetwaly088@gmail.com</p></div>
            </div>
            <button onclick="closeForgotModal()" style="width:100%; padding:12px; border-radius:10px; border:1.5px solid #ddd; background:transparent; font-size:14px; font-weight:600; cursor:pointer; font-family:'Mulish',sans-serif; color:#555;"
                onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script type="module">
        import { auth } from "./firebase-config.js";
        import {
            signInWithEmailAndPassword,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

        // لو المستخدم داخل بالفعل، حوله على services.html على طول
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'services.html';
        });

        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('login-error');
        const submitBtn = form.querySelector('.btn-login');

        function showError(msg) {
            errorBox.textContent = msg;
        }

        function mapFirebaseError(code) {
            switch (code) {
                case 'auth/invalid-email':
                    return 'صيغة البريد الإلكتروني غير صحيحة';
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    return 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
                case 'auth/too-many-requests':
                    return 'محاولات كتير غلط، حاول تاني بعد شوية';
                default:
                    return 'حصل خطأ، جرب تاني';
            }
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            showError('');

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'جاري الدخول...';

            try {
                // Remember me متعلّمة = الجلسة فاضلة بعد قفل المتصفح، غير متعلّمة = تنتهي مع الجلسة
                await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'services.html';
            } catch (error) {
                showError(mapFirebaseError(error.code));
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        // Forgot password modal
        document.querySelector('.forgot-pass').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('forgotModal').style.display = 'flex';
        });
        document.getElementById('forgotModal').addEventListener('click', function(e) {
            if (e.target === this) closeForgotModal();
        });
        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeForgotModal();
        });
    </script>
</body>
</html>
