<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Hub - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="signup.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <div class="logo">
                <a href="index.html" style="display:flex; align-items:center; text-decoration:none; gap:12px;">
                    <img src="assets/images/logo.png" alt="Logo" class="logo-img">
                    <h1>MEDICAL HUB<span>.com</span></h1>
                </a>
            </div>
            <nav class="sliding-nav">
                <div class="nav-indicator"></div>
                <a href="signup.html" class="nav-item">Sign Up</a>
                <a href="login.html" class="nav-item">Login</a>
                <span class="sep">|</span>
                <a href="#" class="nav-item">عربي</a>
            </nav>
        </div>
    </header>

    <div class="signup-container">
        <div class="signup-card">
            <h2>Sign up</h2>
            <p id="signup-error" style="color:#d32f2f; font-size:14px; font-family:'Mulish',sans-serif; margin:0 0 10px; min-height:18px;"></p>
            <form id="signup-form">
                <input type="text" id="name-input" placeholder="Name" required>
                <input type="email" id="email-input" placeholder="Email" required>
                <input type="password" id="password-input" placeholder="Password" required>
                <input type="password" id="confirm-password-input" placeholder="Confirm Password" required>
                <input type="tel" id="phone-input" placeholder="Mobile Number" required>

                <div class="gender-section">
                    <span>Gender:</span>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="male"> Male</label>
                </div>

                <button type="submit" class="btn-submit">Sign up</button>
            </form>
            <div class="foot-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script type="module">
        import { auth } from "./firebase-config.js";
        import {
            createUserWithEmailAndPassword,
            updateProfile,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

        // لو المستخدم داخل بالفعل، حوله على services.html على طول
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'services.html';
        });

        const form = document.getElementById('signup-form');
        const errorBox = document.getElementById('signup-error');
        const submitBtn = form.querySelector('.btn-submit');

        function showError(msg) {
            errorBox.textContent = msg;
        }

        function mapFirebaseError(code) {
            switch (code) {
                case 'auth/email-already-in-use':
                    return 'البريد الإلكتروني ده مستخدم بالفعل';
                case 'auth/invalid-email':
                    return 'صيغة البريد الإلكتروني غير صحيحة';
                case 'auth/weak-password':
                    return 'كلمة المرور لازم تكون 6 أحرف على الأقل';
                default:
                    return 'حصل خطأ، جرب تاني';
            }
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            showError('');

            const name = document.getElementById('name-input').value.trim();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;
            const confirmPassword = document.getElementById('confirm-password-input').value;

            if (password !== confirmPassword) {
                showError('كلمتا المرور غير متطابقتين');
                return;
            }

            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'جاري التسجيل...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                // ده اللي يخلي اسم المستخدم الحقيقي محفوظ جوا حساب الفايربيز نفسه
                await updateProfile(userCredential.user, { displayName: name });
                window.location.href = 'services.html';
            } catch (error) {
                showError(mapFirebaseError(error.code));
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
