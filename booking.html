<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Hub - Booking Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="icon" type="image/png" href="assets/images/logo.png">
    <style>
        :root { 
            --dark-navy: #0b1a32; 
            --light-blue-bg: #e9eff6; 
            --accent-blue: #bdd3f1; 
            --text-gray: #5d8ab9;
            --confirm-blue: #007bff;
        }
        body { font-family: 'Mulish', sans-serif; margin: 0; display: flex; background: #fff; height: 100vh; color: var(--dark-navy); overflow: hidden; }
        .sidebar { width: 320px; background: var(--light-blue-bg); padding: 25px 15px; overflow-y: auto; border-right: 1px solid #d1d9e6; display: flex; flex-direction: column; }
        .sidebar h3 { color: var(--text-gray); font-size: 18px; margin-bottom: 25px; padding-left: 10px; font-weight: 700; }
        .test-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; color: var(--text-gray); cursor: pointer; 
            font-weight: 600; transition: 0.3s; margin-bottom: 5px; border-radius: 10px;
        }
        .test-item.active { color: var(--dark-navy); font-weight: 800; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .test-item.in-cart { color: var(--dark-navy); }
        .plus-btn { 
            background: #5d8ab9; color: white; border-radius: 5px; 
            width: 26px; height: 26px; display: flex; align-items: center; 
            justify-content: center; font-size: 16px; flex-shrink: 0;
            transition: 0.2s; border: none; cursor: pointer;
        }
        .plus-btn.added { background: #e74c3c; }
        .cart-summary {
            margin-top: auto;
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }
        .cart-summary h4 { margin: 0 0 10px; font-size: 14px; color: var(--text-gray); font-weight: 700; }
        .cart-items-list { max-height: 150px; overflow-y: auto; margin-bottom: 10px; }
        .cart-item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; border-bottom: 1px solid #eef2f6; font-size: 13px;
        }
        .cart-item-row:last-child { border-bottom: none; }
        .cart-item-name { color: var(--dark-navy); font-weight: 600; flex: 1; }
        .cart-item-price { color: var(--confirm-blue); font-weight: 800; margin-left: 10px; }
        .cart-item-remove { color: #e74c3c; cursor: pointer; margin-left: 8px; font-size: 11px; }
        .cart-total-row {
            display: flex; justify-content: space-between; 
            padding-top: 10px; border-top: 2px solid var(--accent-blue);
            font-weight: 800; font-size: 15px;
        }
        .cart-total-row .total-val { color: var(--confirm-blue); }
        .cart-empty { color: var(--text-gray); font-size: 13px; text-align: center; padding: 10px 0; }
        .main-content { flex: 1; padding: 20px 40px; overflow-y: auto; background: #fff; }
        .lab-card-top { 
            background: white; padding: 15px 25px; border-radius: 12px; display: flex; 
            align-items: center; gap: 20px; margin-bottom: 25px; 
            border: 1px solid #eee; box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        .lab-card-top img { width: 55px; height: 55px; object-fit: contain; }
        .desc-section { 
            background: var(--dark-navy); color: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(11, 26, 50, 0.2); margin-bottom: 30px;
        }
        .desc-section h3 { margin-top: 0; }
        .pills-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; min-height: 40px; }
        .test-pill { 
            background: var(--accent-blue); color: var(--dark-navy); padding: 8px 18px; 
            border-radius: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 10px;
            font-size: 13px;
        }
        .test-pill i { cursor: pointer; opacity: 0.7; transition: 0.2s; }
        .test-pill i:hover { opacity: 1; color: #e74c3c; }
        .booking-btn { 
            background: white; color: var(--dark-navy); border: none; padding: 14px 45px; 
            border-radius: 30px; font-weight: 800; cursor: pointer; font-size: 16px;
            margin-top: 15px; transition: 0.2s;
        }
        .booking-btn:hover { background: var(--accent-blue); }
        .price-info { margin-top: 20px; font-weight: 600; display: flex; gap: 30px; flex-wrap: wrap; }
        .price-info .val { font-weight: 800; margin-left: 8px; }
        .price-info .total-highlight { color: #7dd3a8; font-size: 18px; }
        .selection-group { background: #e0e6ed; padding: 25px; border-radius: 20px; margin-bottom: 25px; }
        .group-title { margin-top: 0; margin-bottom: 20px; font-size: 18px; font-weight: 800; }
        .grid-layout { display: grid; gap: 15px; }
        .days-grid { grid-template-columns: repeat(3, 1fr); }
        .times-grid { grid-template-columns: repeat(2, 1fr); }
        .card-option { 
            background: #cbd6e2; padding: 20px; border-radius: 12px; text-align: center; 
            cursor: pointer; transition: 0.3s; border: 2px solid transparent;
        }
        .card-option.active { background: var(--accent-blue); border-color: var(--dark-navy); }
        .card-option span { display: block; font-weight: 700; margin-bottom: 5px; }
        .choose-tag { 
            background: white; color: var(--dark-navy); padding: 6px 20px; 
            border-radius: 8px; font-size: 12px; font-weight: 800; 
            display: none; margin: 10px auto 0; width: fit-content;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card-option.active .choose-tag { display: block; animation: popIn 0.2s ease; }
        .choose-tag.confirmed { background: var(--confirm-blue) !important; color: white !important; }
        .time-card { display: flex; justify-content: space-between; align-items: center; text-align: left; background: white; padding: 15px 20px; }
        .time-card .choose-tag { margin: 0; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h3>Available tests</h3>
        <div id="tests-list"></div>
        <div class="cart-summary">
            <h4><i class="fa-solid fa-cart-shopping"></i> Selected Tests</h4>
            <div class="cart-items-list" id="cart-items-list">
                <div class="cart-empty">No tests added yet</div>
            </div>
            <div class="cart-total-row">
                <span>Total</span>
                <span class="total-val" id="cart-total">0 EGP</span>
            </div>
        </div>
    </aside>
    <main class="main-content">
        <div class="lab-card-top">
            <img id="lab-logo" src="assets/images/Al Borg Labs.png" alt="Lab Logo">
            <h2 id="lab-name">Al Borg Labs</h2>
        </div>
        <div class="desc-section">
            <h3>Selected Tests</h3>
            <div class="pills-container" id="pills-container">
                <span style="color: #8da1b5; font-size: 14px;">Press + to add tests</span>
            </div>
            <div class="price-info">
                <div>Original Price: <span class="val" id="price-old">0 EGP</span></div>
                <div>After Discount: <span class="val total-highlight" id="price-new">0 EGP</span></div>
            </div>
            <button class="booking-btn" id="confirm-all-btn">Booking</button>
        </div>
        <div class="selection-group">
            <h3 class="group-title">Choose day</h3>
            <div class="grid-layout days-grid" id="days-container"></div>
        </div>
        <div class="selection-group">
            <h3 class="group-title">Choose your preferred time</h3>
            <div class="grid-layout times-grid" id="times-container"></div>
        </div>
    </main>
    <script>
        const selectedLab = localStorage.getItem('selectedLabName');
        const selectedLogo = localStorage.getItem('selectedLabLogo');
        if (selectedLab) document.getElementById('lab-name').innerText = selectedLab;
        if (selectedLogo) document.getElementById('lab-logo').src = selectedLogo;
        const tests = [
            { name: "Complete Blood Count (CBC)", p: 200, d: 180 },
            { name: "Blood Glucose Test", p: 120, d: 100 },
            { name: "Liver Function Tests (LFTs)", p: 400, d: 350 },
            { name: "Kidney Function Tests (KFTs)", p: 350, d: 300 },
            { name: "Lipid Profile", p: 500, d: 450 },
            { name: "Electrolytes Test", p: 250, d: 200 },
            { name: "Coagulation Profile (PT, PTT, INR)", p: 300, d: 270 },
            { name: "CRP (C-Reactive Protein)", p: 150, d: 130 },
            { name: "Erythrocyte Sedimentation Rate", p: 100, d: 80 },
            { name: "ANA Test", p: 600, d: 550 },
            { name: "Cholesterol Test", p: 150, d: 120 },
            { name: "Glucose Test", p: 100, d: 80 }
        ];
        const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const days = [];
        for (let i = 1; i <= 6; i++) {
            const d = new Date();
            d.setDate(d.getDate() + i);
            days.push(`${dayNames[d.getDay()]}, ${monthNames[d.getMonth()]} ${d.getDate()}`);
        }
        const times = ["9:00 AM to 1:00 PM", "2:00 PM to 4:00 PM", "6:00 PM to 11:00 PM", "9:00 AM to 1:00 PM"];
        let cart = [];
        function updateCartUI() {
            const cartList = document.getElementById('cart-items-list');
            const pillsContainer = document.getElementById('pills-container');
            const totalOriginal = cart.reduce((sum, t) => sum + t.p, 0);
            const totalDiscount = cart.reduce((sum, t) => sum + t.d, 0);
            document.getElementById('price-old').innerText = totalOriginal + ' EGP';
            document.getElementById('price-new').innerText = totalDiscount + ' EGP';
            document.getElementById('cart-total').innerText = totalDiscount + ' EGP';
            cartList.innerHTML = '';
            if (cart.length === 0) {
                cartList.innerHTML = '<div class="cart-empty">No tests added yet</div>';
            } else {
                cart.forEach((t, i) => {
                    const row = document.createElement('div');
                    row.className = 'cart-item-row';
                    row.innerHTML = `<span class="cart-item-name">${t.name}</span><span class="cart-item-price">${t.d} EGP</span><span class="cart-item-remove" onclick="removeFromCart(${i})"><i class="fa-solid fa-xmark"></i></span>`;
                    cartList.appendChild(row);
                });
            }
            pillsContainer.innerHTML = '';
            if (cart.length === 0) {
                pillsContainer.innerHTML = '<span style="color: #8da1b5; font-size: 14px;">Press + to add tests</span>';
            } else {
                cart.forEach((t, i) => {
                    const pill = document.createElement('div');
                    pill.className = 'test-pill';
                    pill.innerHTML = `<span>${t.name}</span><i class="fa-solid fa-trash" onclick="removeFromCart(${i})"></i>`;
                    pillsContainer.appendChild(pill);
                });
            }
        }
        function addToCart(test, btn, testItem) {
            const existingIndex = cart.findIndex(t => t.name === test.name);
            if (existingIndex !== -1) {
                removeFromCart(existingIndex);
                return;
            }
            cart.push(test);
            btn.textContent = '−';
            btn.classList.add('added');
            testItem.classList.add('in-cart');
            updateCartUI();
        }
        function removeFromCart(index) {
            const removedName = cart[index].name;
            cart.splice(index, 1);
            updateCartUI();
            document.querySelectorAll('.test-item').forEach(item => {
                const nameEl = item.querySelector('span');
                if (nameEl && nameEl.textContent.includes(removedName)) {
                    const btn = item.querySelector('.plus-btn');
                    btn.textContent = '+';
                    btn.classList.remove('added');
                    item.classList.remove('in-cart');
                }
            });
        }
        window.onload = function() {
            const list = document.getElementById('tests-list');
            tests.forEach((t) => {
                const div = document.createElement('div');
                div.className = 'test-item';
                div.innerHTML = `<span><i class="fa-solid fa-circle-info"></i> ${t.name}</span><button class="plus-btn">+</button>`;
                const plusBtn = div.querySelector('.plus-btn');
                plusBtn.onclick = (e) => { e.stopPropagation(); addToCart(t, plusBtn, div); };
                div.onclick = () => {
                    document.querySelectorAll('.test-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                };
                list.appendChild(div);
            });
            function renderGrid(containerId, data, isTime) {
                const container = document.getElementById(containerId);
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `card-option ${isTime ? 'time-card' : ''}`;
                    card.innerHTML = isTime 
                        ? `<span><i class="fa-regular fa-clock"></i> ${item}</span><div class="choose-tag">Choose</div>`
                        : `<span>${item}</span><div class="choose-tag">Choose</div>`;
                    card.onclick = () => {
                        container.querySelectorAll('.card-option').forEach(c => {
                            c.classList.remove('active');
                            const tg = c.querySelector('.choose-tag');
                            tg.classList.remove('confirmed');
                            tg.innerText = "Choose";
                        });
                        card.classList.add('active');
                        const tag = card.querySelector('.choose-tag');
                        tag.classList.add('confirmed');
                        tag.innerText = "Confirmed";
                    };
                    container.appendChild(card);
                });
            }
            renderGrid('days-container', days, false);
            renderGrid('times-container', times, true);
            document.getElementById('confirm-all-btn').onclick = function() {
                if (cart.length === 0) { alert('Please add at least one test.'); return; }
                const totalDiscount = cart.reduce((sum, t) => sum + t.d, 0);
                const selectedDayEl = document.querySelector('#days-container .card-option.active span');
                const selectedDay = selectedDayEl ? selectedDayEl.innerText : "Not selected";
                localStorage.setItem('selectedTests', JSON.stringify(cart));
                localStorage.setItem('selectedPrice', totalDiscount + ' EGP');
                localStorage.setItem('selectedDate', selectedDay);
                window.location.href = 'confirmation.html';
            };
        };
    </script>
</body>
</html>
