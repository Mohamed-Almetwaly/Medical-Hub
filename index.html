<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Hub - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="home.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">    
    <style>
        .nav-services {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.3s;
        }
        .nav-services:hover {
            opacity: 0.8;
        }
        .nav-services svg {
            width: 20px;
            height: 20px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 1.8;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <div class="logo">
                <img src="assets/images/logo.png" alt="Logo" class="logo-img">
                <h1>MEDICAL HUB<span>.com</span></h1>
            </div>
            <nav class="sliding-nav">
                <div class="nav-indicator"></div>
                <a href="signup.html" class="nav-item">Sign Up</a>
                <a href="login.html" class="nav-item">Login</a>
                <span class="sep">|</span>
                <a href="#" class="nav-item">عربي</a>
            </nav>
            <a href="#" class="nav-services">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/>
                    <path d="M12 8v8M8 12h8"/>
                </svg>
                Medical Services
            </a>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-wrapper">
            <div class="hero-text-box">
                <h2>Better Healthcare<br>for a Better Life</h2>
            </div>
            <div class="hero-image-box">
                <img src="assets/images/doctors_team.png" alt="Doctors Team" class="main-doctors-img">
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
