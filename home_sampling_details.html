<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Hub - Home Sampling</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="laboratory.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>
    <header class="inner-header">
        <div class="inner-header-container">
            <div class="header-left">
                <img src="assets/images/icon.png" class="page-icon">
                <span class="page-title">Home Sampling Booking</span>
            </div>
        </div>
    </header>

    <div class="lab-main-layout">
        <main class="lab-content" style="width: 100%; padding: 60px;">
            <div style="max-width: 600px; margin: auto; background: #f7faff; padding: 30px; border-radius: 20px;">
                <h2 style="color: #0b1a32; margin-bottom: 20px;">Request a Home Visit</h2>
                <p style="color: #8da1b5; margin-bottom: 30px;">Our team will come to your location in El Shorouk City.</p>
                <button class="choose-btn" style="width: 100%; background: #0b1a32; color: #fff; padding: 15px;">Confirm Request</button>
            </div>
        </main>
    </div>
</body>
</html>
